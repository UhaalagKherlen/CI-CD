name: CI

on:
  push:
    branches: [ "main" ]
  # Optional bei Pull Requests:
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Code auschecken
      - name: Checkout
        uses: actions/checkout@v4

      # 2. .NET SDK installieren 
      #    (für net8.0 musst du eine Pre-Release anfordern)
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          include-prerelease: true

      # 3. Projekt bauen (pfad anpassen!)
      - name: Build
        run: dotnet build MyConsoleApp/MyConsoleApp.csproj --configuration Release

      # 4. Publizieren (fertige Binaries in ./publish)
      - name: Publish
        run: dotnet publish MyConsoleApp/MyConsoleApp.csproj --configuration Release --output ./publish

      # 5. Artefakte hochladen
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyConsoleApp-publish
          path: ./publish
          if-no-files-found: warn
