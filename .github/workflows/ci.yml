name: CI

on:
  push:
    branches: [ "main" ]
  # Optional auch bei Pull Requests:
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Code auschecken
      - uses: actions/checkout@v4

      # 2) .NET-Umgebung einrichten
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'
          # oder '6.0.x', je nachdem was du benutzt

      # 3) Projekt bauen
      - name: Build
        run: dotnet build MyConsoleApp/MyConsoleApp.csproj --configuration Release

      # 4) Publish (fertige Binaries in ein eigenes Verzeichnis legen)
      - name: Publish
        run: dotnet publish MyConsoleApp/MyConsoleApp.csproj --configuration Release --output ./publish

      # 5) Artefakt hochladen
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyConsoleApp-Publish
          path: ./publish
          if-no-files-found: warn
